# SPDX-License-Identifier: Apache-2.0
# Release the `vyges-rsz` CLI (part of the `vyges install physical` suite).
#
# Modelled on vyges-tools/opendb's release-opendb.yml, and for the same reason: vyges-rsz reads
# the design database through vyges-opendb, which statically links libodb (a C++ library built
# from source). That makes this unix-only and native per-target — no cross-compilation.
#
# Produces vyges-rsz-<rust-triple>.tar.gz assets whose names + contents match what the vyges CLI
# expects: install_one() fetches `vyges-rsz-<target>.tar.gz` from
# github.com/vyges-tools/rsz/releases/latest/download/ and extracts a `vyges-rsz` binary.
#
# This has to exist BEFORE `rsz` is added to the CLI's install list: an engine listed with no
# release behind it turns every install into a 404.
#
# Trigger: push a tag `v*` (publishes a Release with all three assets), or run manually to smoke
# the build (workflow_dispatch uploads artifacts only, no Release).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (backfill_macos only; empty = smoke build)"
        required: false
        type: string
      backfill_macos:
        description: "Build ONLY the macOS leg at `tag` and attach it to that existing release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # create the Release + upload assets on a tag

jobs:
  # Which legs to build. A tag push or an ordinary dispatch builds every leg; a backfill dispatch
  # (backfill_macos=true, tag=<existing release>) builds ONLY the macOS leg at that tag and attaches
  # it to the release already published. GitHub's hosted macOS capacity is not always there, and a
  # release ships on Linux green without it; the macOS assets follow by backfill:
  #   gh workflow run release.yml -R <repo> -f tag=<tag> -f backfill_macos=true
  # The leg list lives in this job because a job-level `if:` cannot see `matrix`.
  plan:
    name: plan
    runs-on: ubuntu-${{ vars.VYGES_UBUNTU_VERSION || '24.04' }}
    outputs:
      include: ${{ steps.legs.outputs.include }}
    steps:
      - id: legs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BACKFILL: ${{ inputs.backfill_macos && 'true' || 'false' }}
          TAG: ${{ inputs.tag }}
          # Same support matrix as opendb, which this transitively builds: Linux x86_64/arm64 +
          # Apple Silicon on macos-15 (Xcode 16 — new enough for cxx, stable for fmt 11.0.2;
          # macos-latest/Xcode 26.5 breaks fmt consteval). Intel Mac is unsupported.
          LEGS: >-
            [
              {"os": "ubuntu-${{ vars.VYGES_UBUNTU_VERSION || '24.04' }}", "target": "x86_64-unknown-linux-gnu"},
              {"os": "ubuntu-${{ vars.VYGES_UBUNTU_VERSION || '24.04' }}-arm", "target": "aarch64-unknown-linux-gnu"},
              {"os": "macos-${{ vars.VYGES_MACOS_VERSION || '15' }}", "target": "aarch64-apple-darwin"}
            ]
        run: |
          set -euo pipefail
          if [ "$BACKFILL" = true ]; then
            [ -n "$TAG" ] || { echo "::error::backfill_macos needs tag=<an existing release>"; exit 1; }
            gh release view "$TAG" >/dev/null \
              || { echo "::error::no release $TAG to backfill: it is published by the tag run first"; exit 1; }
            LEGS=$(jq -c '[.[] | select(.target == "aarch64-apple-darwin")]' <<<"$LEGS")
          fi
          echo "include=$(jq -c . <<<"$LEGS")" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: vyges-tools-rsz
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    steps:
      # Sibling layout: <ws>/vyges-tools-rsz + opendb + opendb-lib,
      # so both `[patch]` path entries in Cargo.toml resolve on CI. Every patched dependency needs
      # a checkout here — a patch whose path does not exist is a hard `failed to load source` at
      # build time, not a fall-back to the git source.
      - uses: actions/checkout@v7
        with:
          # backfill: build the released sources (the tag), not the dispatch branch
          ref: ${{ inputs.backfill_macos && inputs.tag || '' }}
          path: vyges-tools-rsz
      - uses: actions/checkout@v7
        with:
          repository: vyges-tools/opendb
          path: vyges-tools-opendb
      - uses: actions/checkout@v7
        with:
          repository: vyges-tools/opendb-lib
          path: vyges-tools-opendb-lib
      - uses: actions/checkout@v7
        with:
          repository: vyges-tools/sta
          path: vyges-tools-sta
      - uses: actions/checkout@v7
        with:
          repository: vyges-tools/grt
          path: vyges-tools-grt
      - uses: actions/checkout@v7
        with:
          repository: vyges-tools/est
          path: vyges-tools-est
      - uses: actions/checkout@v7
        with:
          repository: vyges-tools/stt
          path: vyges-tools-stt
      - uses: actions/checkout@v7
        with:
          repository: vyges-tools/loom
          path: vyges-tools-loom
      - uses: actions/checkout@v7
        with:
          repository: vyges-tools/layout
          path: vyges-tools-layout
      - uses: actions/checkout@v7
        with:
          repository: vyges-tools/dpl
          path: vyges-tools-dpl

      - name: Toolchain (Linux)
        # Boost (headers) + zlib only; fmt/spdlog/abseil are built from source by libodb's build.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ git bison libboost-dev libboost-iostreams-dev libbz2-dev zlib1g-dev

      - name: Toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake boost bison   # bison for the LEF/DEF parsers

      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: ${{ matrix.target }}

      - name: Build (release; libodb built from source, static)
        # No --locked: the [patch] resolves the opendb
        # crates to the freshly-checked-out siblings @ main — let Cargo resolve.
        # macOS: put the (keg-only, newer) brew bison ahead of the 2.x system one for the LEF/DEF
        # parsers.
        run: |
          [ "${{ runner.os }}" = "macOS" ] && export PATH="$(brew --prefix bison)/bin:$PATH"
          cargo build --release --features cli --bin vyges-rsz

      # Runner and glibc floor, one policy for every release: vyges-tools/actions.
      - name: glibc ceiling
        uses: vyges-tools/actions/glibc-ceiling@v1
        with:
          runner: ${{ matrix.os }}
          working-directory: vyges-tools-rsz
          paths: target

      - name: Package vyges-rsz-${{ matrix.target }}.tar.gz
        id: pkg
        run: |
          set -eu
          NAME="vyges-rsz-${{ matrix.target }}"
          STAGE="$RUNNER_TEMP/$NAME"
          mkdir -p "$STAGE"
          cp target/release/vyges-rsz "$STAGE/"
          strip "$STAGE/vyges-rsz" 2>/dev/null || strip -x "$STAGE/vyges-rsz" || true
          cp LICENSE NOTICE README.md "$STAGE/" 2>/dev/null || true
          cp THIRD_PARTY_LICENSES.md "$STAGE/" 2>/dev/null || true
          tar -C "$RUNNER_TEMP" -czf "$GITHUB_WORKSPACE/$NAME.tar.gz" "$NAME"
          ( cd "$GITHUB_WORKSPACE" && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256" )
          echo "asset=$NAME.tar.gz" >> "$GITHUB_OUTPUT"
          echo "--- $NAME.tar.gz ---"; tar -tzf "$GITHUB_WORKSPACE/$NAME.tar.gz"; cat "$GITHUB_WORKSPACE/$NAME.tar.gz.sha256"

      - name: Upload build artifact (always)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.asset }}
          path: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}.sha256
          if-no-files-found: error

      - name: Attach to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}.sha256

      # macOS backfill (backfill_macos=true): attach this leg's assets to the EXISTING release at
      # `tag` with `gh release upload --clobber`. It never creates or edits the release. Where the
      # release carries a SHA256SUMS, its lines for these files are replaced and it is re-uploaded.
      - name: Backfill macOS assets onto the existing release
        if: ${{ inputs.backfill_macos }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd "$GITHUB_WORKSPACE"
          tars=( *-"$TARGET".tar.gz )
          [ ${#tars[@]} -gt 0 ] || { echo "::error::no $TARGET tarball was packaged"; exit 1; }
          files=( "${tars[@]}" *-"$TARGET".tar.gz.sha256 )
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx SHA256SUMS; then
            sums="$RUNNER_TEMP/sums/SHA256SUMS"
            gh release download "$TAG" -p SHA256SUMS -D "$RUNNER_TEMP/sums" --clobber
            for t in "${tars[@]}"; do
              awk -v t="$t" '$2 != t' "$sums" > "$sums.new"; mv "$sums.new" "$sums"
            done
            shasum -a 256 "${tars[@]}" >> "$sums"
            files+=( "$sums" )
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
          echo "backfilled $TAG: ${files[*]##*/}"
